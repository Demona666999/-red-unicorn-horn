<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кнопки + чатик</title>
    <link rel="stylesheet" href="..\css\mod10_stile.css">
    <style>  
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa&family=Playpen+Sans:wght@100..800&display=swap');
    </style>
</head>
<body>
    <div class="button-container" id="toggleButton">
        <svg class="svg-icon" id="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-5.904-2.854a.5.5 0 1 1 .707.708L6.707 9.95h2.768a.5.5 0 1 1 0 1H5.5a.5.5 0 0 1-.5-.5V6.475a.5.5 0 1 1 1 0v2.768z"/>
        </svg>
        <span>Нажми на меня</span>
    </div>
    <button class="screen-size__button">Показать размер экрана</button>
 <div class="chat">
    <div class="chat__window" id="chatWindow"></div>
    <div class="chat_button"></div>
     <input type="text" id="messageInput" placeholder="Введите сообщение" />
      <button class="screen-size__button" id="sendBtn">Отправить</button>
      <button class="screen-size__button" id="geoBtn">Гео-локация</button>
    </div>
  </div>

    <script src="..\js\mod10_clik.js"></script>
    <script src="..\js\mod10_chat.js"></script>
</body>
</html>
